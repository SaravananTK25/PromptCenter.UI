<div class="auth-page">

    <div class="auth-container">

        <!-- BRAND PANEL -->
        <section class="brand-panel">

            <div class="brand-logo">
                <span class="brand-mark">P</span>
                <span class="brand-name">PromptCenter</span>
            </div>

            <h1>Reset your password</h1>

            <p>
                Create a new password for your PromptCenter account.
            </p>

        </section>


        <!-- FORM PANEL -->
        <section class="form-panel">


            <!-- ========================= -->
            <!-- SUCCESS MESSAGE -->
            <!-- ========================= -->

            <div *ngIf="passwordReset" class="success-state">

                <div class="success-icon">✓</div>

                <h2>Password reset successfully</h2>

                <p>
                    {{ message }}
                </p>

                <button
                    type="button"
                    class="primary-btn"
                    (click)="goToLogin()">

                    Go to Login

                </button>

            </div>


            <!-- ========================= -->
            <!-- RESET PASSWORD FORM -->
            <!-- ========================= -->

            <form
                *ngIf="!passwordReset"
                (ngSubmit)="resetPassword()">

                <h2>Set new password</h2>

                <p class="subtitle">
                    Enter your new password below.
                </p>


                <!-- TOKEN ERROR -->

                <div
                    *ngIf="tokenError"
                    class="error-message">

                    {{ tokenError }}

                </div>


                <!-- GENERAL ERROR -->

                <div
                    *ngIf="errorMessage"
                    class="error-message">

                    {{ errorMessage }}

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        id="newPassword"
                        type="password"
                        name="newPassword"
                        [(ngModel)]="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        [class.input-error]="newPasswordError"
                    />

                    <div
                        *ngIf="newPasswordError"
                        class="field-error">

                        {{ newPasswordError }}

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        name="confirmPassword"
                        [(ngModel)]="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        [class.input-error]="confirmPasswordError"
                    />

                    <div
                        *ngIf="confirmPasswordError"
                        class="field-error">

                        {{ confirmPasswordError }}

                    </div>

                </div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    class="primary-btn"
                    [disabled]="isLoading">

                    <span *ngIf="!isLoading">
                        Reset Password
                    </span>

                    <span *ngIf="isLoading">
                        Resetting...
                    </span>

                </button>


                <!-- BACK BUTTON -->

                <button
                    type="button"
                    class="back-btn"
                    (click)="goToLogin()">

                    Back to Login

                </button>

            </form>

        </section>

    </div>

</div>
