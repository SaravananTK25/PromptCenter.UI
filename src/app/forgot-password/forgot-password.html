<div class="forgot-page">

    <div class="forgot-container">

        <div class="brand">
            <span class="brand-mark">P</span>
            <span class="brand-name">PromptCenter</span>
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your email address and we'll help you reset your password.
        </p>

        <form *ngIf="!submitted" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    autocomplete="email" />
            </div>

            <div class="error" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loading">
                {{ loading ? 'Please wait...' : 'Continue' }}
            </button>

        </form>

        <div class="success" *ngIf="submitted">
            <div class="success-icon">✓</div>

            <h2>Check your email</h2>

            <p>{{ message }}</p>
        </div>
        <div *ngIf="resetLink" class="dev-reset-link">

            <p><strong>Development Mode</strong></p>

            <p>Password reset link:</p>

            <input type="text" [value]="resetLink" readonly />

            <button type="button" (click)="copyResetLink()">
                Copy Reset Link
            </button>

            <a [href]="resetLink">
                Open Reset Password
            </a>

        </div>
        <a class="back-login" routerLink="/login">
            ← Back to Login
        </a>

    </div>

</div>
